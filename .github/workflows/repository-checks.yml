name: Repository integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check preserved artifacts and documentation links
        shell: pwsh
        run: ./tools/verify-repository.ps1
      - name: Check whitespace
        shell: pwsh
        run: git diff --check HEAD^ HEAD
